name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mightyeye
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: mightyeye_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mightyeye -d mightyeye_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://mightyeye:ci_only_password@127.0.0.1:5432/mightyeye_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -q
      - run: mightyeye-observations validate examples/observations.jsonl
      - run: mightyeye-observations replay examples/observations.jsonl
      - run: mightyeye-observations demo --output output/ci-demo
      - uses: actions/upload-artifact@v4
        with:
          name: acceptance-python-${{ matrix.python }}
          path: output/ci-demo/acceptance.json
