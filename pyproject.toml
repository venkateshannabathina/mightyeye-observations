[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mightyeye-observations"
version = "0.2.0"
description = "MightyEye observation contract, DeepStream adapter, synthetic generator and offline replay"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9,<3", "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "SQLAlchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "psutil>=6,<8",
  "httpx>=0.27,<1", "Pillow>=11,<13", "imageio-ffmpeg>=0.6,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff==0.16.7"]

[project.scripts]
mightyeye-observations = "mightyeye_observations.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
mightyeye_observations = ["dashboard/*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
